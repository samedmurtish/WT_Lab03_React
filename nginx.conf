server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Tek sayfalı uygulama: bilinmeyen her adres index.html'e düşer,
    # yönlendirmeyi React tarafı yapar.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite derlenen dosyaların adına içerik özeti (hash) ekler; uzun süre önbelleğe alınabilir.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
